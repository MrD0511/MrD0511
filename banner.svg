<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Dhruv Sharma, software engineer. Terminal showing redis-cli ping answered with PONG.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="300" rx="4" fill="url(#accent)"/>

  <!-- left: name and role -->
  <text x="64" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">Dhruv Sharma</text>
  <text x="66" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#94a3b8">Software engineer. Full stack, with a soft spot for systems.</text>
  <rect x="66" y="196" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="66" y="238" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#64748b">Java  |  TypeScript  |  Python  |  Next.js  |  FastAPI</text>

  <!-- right: terminal -->
  <g transform="translate(760 62)">
    <rect width="380" height="176" rx="10" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="46" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="22" r="6" fill="#22c55e"/>
    <text x="24" y="70" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#94a3b8">$ redis-cli -p 6379 ping</text>
    <text x="24" y="98" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#4ade80">PONG</text>
    <text x="24" y="132" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#94a3b8">$ redis-cli set hello world</text>
    <text x="24" y="158" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#4ade80">OK  <tspan fill="#475569">(served by CAPIS)</tspan></text>
  </g>
</svg>
